# Egress proxy for the agent container: a CONNECT-only domain allowlist.
#
# No TLS interception (traffic stays end-to-end encrypted; the ACL matches the
# CONNECT hostname), no caching, no disk state. Squid is a policy gate here,
# not an accelerator — and because CONNECT tunnels are opaque byte pipes, it
# adds no buffering to the token stream from api.anthropic.com.
#
# Runs UNPRIVILEGED (compose sets `user: proxy` and drops all capabilities);
# port 3128 needs no root, and both writable paths below sit on tmpfs.

http_port 3128

# Squid resolves its own hostname at startup and warns — or refuses to start —
# when it cannot. The container's hostname is whatever the runtime assigned it,
# so name the proxy explicitly instead of depending on that.
visible_hostname agent-egress-proxy

# Running unprivileged, squid cannot write the default /var/run/squid.pid.
# Point it somewhere the squid user owns. Under rootless podman that tmpfs also
# needs an explicit mode — see the tmpfs keys in docker-compose.sandbox.yml.
pid_filename /var/cache/squid/squid.pid

# Denials never reach a connect, so they cost milliseconds whatever this is set
# to. It only bounds reaching an ALLOWED host, where a tight limit buys nothing
# and turns a slow upstream into a spurious failure.
connect_timeout 15 seconds
forward_max_tries 2

# No cache: nothing cacheable flows through a CONNECT tunnel anyway. cache_mem
# is zero to match — reserving a buffer for traffic that is never cached is a
# claim the rest of this file contradicts.
cache deny all
cache_mem 0 MB

# The ICMP pinger needs CAP_NET_RAW, which compose drops. Squid survives the
# pinger's death but logs it as a FATAL — turn it off so the log stays honest.
pinger_enable off

# Logs to the container's stdout/stderr; no writable log directory needed, and
# rotation is the runtime's job once the logs are file descriptors it owns.
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none

# Don't advertise the internal topology to upstream servers.
via off
forwarded_for delete
httpd_suppress_version_string on

# The allowlist file: one domain per line, leading dot = include subdomains —
# squid's dstdomain semantics match the file format exactly.
acl allowlist dstdomain "/etc/squid/allowlist.txt"

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Order matters: deny odd ports, deny CONNECT to anything but 443, then allow
# exactly the allowlist and deny the rest.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all
