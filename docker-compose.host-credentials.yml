# Optional overlay: share the HOST user's Claude Code login with the container
# instead of running a separate `docker compose run --rm -it claude-wrapper login`.
#
#   docker compose -f docker-compose.single.yml -f docker-compose.host-credentials.yml up -d
#
# Single-container layout only (the CLI runs in the API container there).
# The default sandboxed stack keeps credentials in the claude-home volume
# owned by the agent; see README "First-time login".
#
# Requirements — all three, or auth fails in confusing ways:
#
#   1. CLAUDE_HOST_CREDENTIALS must point at an EXISTING file. Docker creates a
#      missing bind source as a root-owned *directory*; Claude Code then finds a
#      directory where its credentials file should be and reports no saved login.
#   2. CLAUDE_UID / CLAUDE_GID must match that file's owner. Credentials are
#      mode 600, so a uid mismatch means the container simply cannot read them.
#   3. The host login must stay valid. This mounts a single file, so an in-
#      container token refresh cannot replace the inode — refreshes happen host
#      side. If the host token expires, re-login on the host, not in here.
#
# Prefer the container's own login (the base compose file) for anything
# long-running or headless; it refreshes its own token on the claude-home volume.
services:
  claude-wrapper:
    volumes:
      - ${CLAUDE_HOST_CREDENTIALS:?set CLAUDE_HOST_CREDENTIALS to your host ~/.claude/.credentials.json}:/home/claude/.claude/.credentials.json:ro
